<html lang="ko">
<head>

    <title>Trick or Text: 비상 사태</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0d0d0d;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #d4d4d4;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px 15px 50px 15px;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        h1 {
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #008000;
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            word-break: keep-all;
        }
        
        .subtitle {
            color: #ffd700;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 15px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .status-board {
            background: #1a1a1a;
            border: 1px solid #39ff14;
            padding: 6px 15px;
            color: #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 5px;
        }

        .timer-board {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            padding: 6px 15px;
            color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 5px;
            transition: all 0.1s;
        }

        @keyframes timePenaltyFlash {
            0% { background-color: #ff0000; color: #ffffff; transform: scale(1.2) rotate(-3deg); box-shadow: 0 0 30px #ff0000; }
            25% { transform: scale(1.1) rotate(3deg); }
            50% { transform: scale(1.15) rotate(-2deg); }
            100% { background-color: #1a1a1a; color: #ff3333; transform: scale(1) rotate(0deg); }
        }
        .flash { 
            animation: timePenaltyFlash 0.5s ease-out; 
            border-color: #ff0000 !important;
        }

        .ufo-track-container {
            max-width: 650px;
            margin: 0 auto 18px auto;
            background: #1a1a1a;
            border: 1px solid #39ff14;
            border-radius: 20px;
            height: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .ufo-progress {
            background: linear-gradient(90deg, #ff3333, #ff9933);
            height: 100%;
            width: 100%;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ufo-icon {
            position: absolute;
            top: -3px;
            left: 100%;
            font-size: 1.1rem;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(-100%);
            white-space: nowrap;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 260px));
            justify-content: center;
            gap: 15px 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            aspect-ratio: 2 / 3;
            perspective: 1000px;
            cursor: pointer;
        }

        @media (max-width: 750px) {
            .card-container {
                grid-template-columns: repeat(2, minmax(150px, 1fr));
                gap: 15px;
            }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s ease-out;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        .card-front {
            background: #0d1a0d;
            border: 2px solid #39ff14;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.4), inset 0 0 12px rgba(57, 255, 20, 0.2);
        }
        
        .card-front-inner {
            background-color: #111;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            border: 1px solid #222;
        }
        
        .card-front-inner p {
            background: rgba(0,0,0,0.85);
            color: #39ff14;
            padding: 8px 12px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid #39ff14;
            border-radius: 4px;
            line-height: 1.4;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .card-back {
            background-color: #0a0a0a;
            border: 2px solid #ff3333;
            box-shadow: inset 0 0 20px rgba(255, 51, 51, 0.2);
            transform: rotateY(180deg);
            color: #fff;
            padding: 12px;
        }
        
        .alien-icon { font-size: 2rem; text-shadow: 0 0 10px #39ff14; margin-bottom: 5px;}
        
        .btn-choice {
            background-color: #1a1a1a;
            color: #39ff14;
            border: 1px solid #39ff14;
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 12px 8px;
            font-family: inherit;
            font-size: clamp(0.9rem, 2vw, 1.05rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
            word-break: keep-all;
            line-height: 1.3;
        }
        .btn-choice:hover {
            background-color: #39ff14;
            color: #000;
        }

        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 13, 13, 0.95);
            padding: 8px 0;
            color: #39ff14;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 1000;
            text-shadow: 0 0 10px #39ff14, 0 0 20px rgba(57, 255, 20, 0.6);
            border-top: 1px solid rgba(57, 255, 20, 0.3);
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .error { animation: errorShake 0.3s ease-in-out; }
        
        .resolved {
            border-color: #39ff14 !important;
            box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.2) !important;
        }
        .resolved h3 { color: #39ff14; margin: 6px 0; font-size: 1.1rem; font-weight: 900; }

            background: #1a0505;
            border: 1px solid #ff3333;
            padding: 15px;
            margin: 15px auto;
            max-width: 600px;
            border-radius: 8px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>

            { id: 'b34', imageSrc: "book34.jpg", o1: "고백해도 되는 타이밍", o2: "고백해도 돼는 타이밍", answer: "고백해도 되는 타이밍", note: "자음 어미 '-는' 앞에서는 '되-'를 씁니다." },
            { id: 'b35', imageSrc: "book35.jpg", o1: "어쩌다 중학생 같은 걸 하고 있을까", o2: "어쩌다 중학생 같은 걸 하고 잇을까", answer: "어쩌다 중학생 같은 걸 하고 있을까", note: "존재를 뜻하는 말은 쌍시옷 받침의 '있다'입니다." },
            { id: 'b36', imageSrc: "book36.jpg", o1: "너무 늦은 안녕은 없다", o2: "너무 늣은 안녕은 없다", answer: "너무 늦은 안녕은 없다", note: "기본형은 '늦다(지긋하다)'입니다." },
            { id: 'b37', imageSrc: "book37.jpg", o1: "죽음의 수용소에서", o2: "죽음의 수용서에서", answer: "죽음의 수용소에서", note: "일정한 시설을 뜻하는 한자는 '소(所)'입니다." },
            { id: 'b38', imageSrc: "book38.jpg", o1: "개를 낳았다", o2: "개를 나았다", answer: "개를 낳았다", note: "새끼를 세상에 나오게 함은 '낳다'입니다." },
            { id: 'b39', imageSrc: "book39.jpg", o1: "나 혼자만 레벨업", o2: "나 혼자만 레밸업", answer: "나 혼자만 레벨업", note: "외래어 표기법에 따라 '레벨'이 맞습니다." },
            { id: 'b40', imageSrc: "book40.jpg", o1: "나의 비거니즘 만화", o2: "나의 비건이즘 만화", answer: "나의 비거니즘 만화", note: "어원 뒤에 접미사가 결합하여 연음된 '비거니즘'이 맞습니다." },
            { id: 'b41', imageSrc: "book41.jpg", o1: "양면의 조개껍데기", o2: "양면의 조개껍대기", answer: "양면의 조개껍데기", note: "거센소리 뒤에는 주로 '데기'가 붙습니다." }
        ];

        let timeLeft = CONFIG.TIME_LIMIT;
        let timerInterval = null;
        let gameStarted = false;
        let score = 0;
        let missedItems = [];

        document.getElementById('target-score').innerText = CONFIG.QUESTIONS_PER_GAME;
        document.getElementById('timer-display').innerText = `⏳ ${CONFIG.TIME_LIMIT}초`;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (type === 'flip') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'correct') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; 
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    let startTime = audioCtx.currentTime + idx * 0.13;
                    let duration = (idx === notes.length - 1) ? 0.7 : 0.12;
                    o.frequency.setValueAtTime(freq, startTime);
                    g.gain.setValueAtTime(0.35, startTime);
                    g.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                    o.start(startTime);
                    o.stop(startTime + duration);
                });
            }
        }

        function launchFireworks() {
            if (typeof confetti !== 'function') return;
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#39ff14', '#ffd700', '#ff3333', '#00ffff'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#39ff14', '#ffd700', '#ff3333', '#00ffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function updateProgressVisuals() {
            let pct = (timeLeft / CONFIG.TIME_LIMIT) * 100;
            document.getElementById('ufo-bar').style.width = pct + '%';
            document.getElementById('ufo-ico').style.left = pct + '%';
        }

        function startTimer() {
            if (gameStarted) return;
            gameStarted = true;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = `⏳ ${timeLeft}초`;
                updateProgressVisuals();

                if (timeLeft <= 5 && timeLeft > 0) {
                    playSound('wrong');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver();
                }
            }, 1000);
        }

        function triggerGameOver() {
            playSound('gameover');
            
            let noteHtml = "";
            if(missedItems.length > 0) {
                noteHtml = `<div class="wrong-note-box"><h4 style="color:#ff3333; margin:0 0 10px; font-size:1.1rem;">🚨 오답 분석 노트</h4><ul>`;
                missedItems.forEach(item => {
                    noteHtml += `<li style="margin-bottom:10px; font-size:1.05rem;"><strong>${item.answer}</strong><br><span style="color:#a0a0a0; font-size:0.9rem;">💡 ${item.note}</span></li>`;
                });
                noteHtml += `</ul></div>`;
            }

            document.body.style.backgroundColor = '#1a0000';
            document.body.innerHTML = `
                <div style="margin-top:3vh; padding-bottom:50px;">
                    <h1 style="color:#ff3333; font-size: 2.5rem; text-shadow: 0 0 20px #ff0000;">🚨 외계인에게 납치되었습니다! 🚨</h1>
                    <div style="font-size: 4rem; margin: 10px;">🛸💥😱</div>
                    <p style="color:#ff6666; font-size: 1.2rem; font-weight:bold;">시간 초과! 외계인의 광선에 붙잡혀 우주선에 끌려갔습니다...</p>
                    ${noteHtml}
                    <button onclick="location.reload()" style="font-size:1.2rem; padding: 12px 25px; margin-top:10px; background-color:#ff3333; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:700;">다시 도전하기</button>
                </div>
                <div id="footer">${CONFIG.LIBRARY_NAME}</div>
            `;
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            score = 0;
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            const gameData = shuffle(bookData).slice(0, CONFIG.QUESTIONS_PER_GAME);

            gameData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${item.id}`;
                
                card.onclick = function() { 
                    startTimer();
                    playSound('flip'); 
                    this.classList.toggle('flipped'); 
                };

                const options = shuffle([item.o1, item.o2]);

                const backContent = `
                    <div class="alien-icon">👽</div>
                    <p style="margin:5px 0 10px; color:#ff3333; font-weight:700; word-break:keep-all; font-size:1rem;">
                        맞춤법에 맞는 책 제목을 찾아줘!
                    </p>
                    <button class="btn-choice" onclick="checkAnswer(event, '${item.id}', this)">${options[0]}</button>
                    <button class="btn-choice" onclick="checkAnswer(event, '${item.id}', this)">${options[1]}</button>
                `;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="card-front-inner" style="background-image: url('${item.imageSrc}');">
                                <p>🚫 접근 금지 🚫<br>표지 데이터 손상</p>
                            </div>
                        </div>
                        <div class="card-back" id="back-${item.id}">
                            ${backContent}
                            <p id="msg-${item.id}" style="color:#ff3333; font-size:0.9rem; margin-top:5px; min-height:16px; font-weight:700;"></p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function checkAnswer(event, id, btnElement) {
            event.stopPropagation();
            if(timeLeft <= 0) return;

            const userAnswer = btnElement.innerText.trim();
            const currentItem = bookData.find(b => b.id === id);
            const correctAnswer = currentItem.answer.trim();

            const msgElement = document.getElementById(`msg-${id}`);
            const backPanel = document.getElementById(`back-${id}`);
            const cardElement = document.getElementById(`card-${id}`);
            const timerDisplay = document.getElementById('timer-display');
            
            if (userAnswer === correctAnswer) {
                backPanel.classList.add('resolved');
                backPanel.innerHTML = `
                    <div class="alien-icon" style="text-shadow: none; opacity: 0.8;">🛸💨</div>
                    <h3>우리말 구출 완료!</h3>
                    <p style="color:#39ff14; font-size:1.1rem; font-weight:700; word-break:keep-all; margin: 8px 0;">${correctAnswer}</p>
                    <p style="color:#a0a0a0; font-size:0.9rem; margin: 0;">외계인이 도망갔습니다.</p>
                `;
                score++;
                document.getElementById('score').innerText = score;

                if (score === CONFIG.QUESTIONS_PER_GAME) {
                    clearInterval(timerInterval); 
                    playSound('fanfare'); 
                    
                    let now = new Date();
                    let timeString = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                    
                    // 1부터 1000까지의 랜덤 난수 생성 (예: 007, 042, 999)
                    let randomNum = Math.floor(Math.random() * 1000) + 1;
                    let certCode = `[ 매화뜨락-NO.${String(randomNum).padStart(3, '0')} ]`;

                    setTimeout(() => {
                        document.body.innerHTML = `
                            <div style="margin-top:3vh; padding-bottom:50px;">
                                <h1 style="color:#39ff14; font-size: 2.5rem;">🎉 우리말 구출 대성공! 🎉</h1>
                                <p style="color:#d4d4d4; font-size: 1.15rem; font-weight:700;">외계인을 물리치고 모든 책 표지를 원래대로 되돌렸습니다!</p>
                                <p style="color:#ffd700; font-size: 1.1rem; margin-bottom: 15px; font-weight:700;">남은 시간: ${timeLeft}초 | 완료 시각: <span id="live-clock">${timeString}</span></p>
                                <div style="margin: 15px auto; padding: 25px; border: 2px dashed #39ff14; background:rgba(57,255,20,0.1); display: inline-block; border-radius:10px; max-width:550px;">
                                    <h2 style="color:#ffd700; margin-top:0; font-size:1.4rem;">외계인 퇴치 성공 인증서</h2>
                                    <p style="color:#fff; font-size:1.1rem;">인증 코드: <strong style="color:#ff3333; font-size:1.4rem; background-color:#ffe6e6; padding:2px 8px; border-radius:4px;">${certCode}</strong></p>
                                    <p style="color:#39ff14; font-size:1rem; font-weight:700;">이 화면을 캡처하여 도서부에게 보여주세요!</p>
                                    <p style="color:#fff; font-size:0.95rem;">오프라인 상품 교환권으로 바꿀 수 있습니다 🎁</p>
                                </div>
                                <br>
                                <button onclick="location.reload()" style="font-size:1.2rem; padding: 12px 25px; margin-top:15px; background-color:#39ff14; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:700;">다시 하기</button>
                            </div>
                            <div id="footer">${CONFIG.LIBRARY_NAME}</div>
                        `;
                        launchFireworks();

                        setInterval(() => {
                            let d = new Date();
                            let tStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
                            let clockEl = document.getElementById('live-clock');
                            if(clockEl) clockEl.innerText = tStr;
                        }, 1000);

                    }, 600);
                } else {
                    playSound('correct'); 
                }
            } else {
                playSound('wrong'); 
                
                // 오답 시 5초 즉시 삭감 및 화면 업데이트
                timeLeft = Math.max(0, timeLeft - CONFIG.WRONG_PENALTY);
                timerDisplay.innerText = `⏳ ${timeLeft}초 (-5초!)`;
                updateProgressVisuals();

                // 타이머 시각적 충격 애니메이션
                timerDisplay.classList.remove('flash');
                void timerDisplay.offsetWidth; // 애니메이션 초기화 트릭
                timerDisplay.classList.add('flash');

                if(!missedItems.some(i => i.id === id)) {
                    let missedBook = bookData.find(b => b.id === id);
                    if(missedBook) missedItems.push(missedBook);
                }

                if (msgElement) msgElement.innerText = "경고: 오답! -5초 감점 삐리-";
                cardElement.classList.remove('error');
                void cardElement.offsetWidth;
                cardElement.classList.add('error');

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    triggerGameOver();
                }
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
