<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick or Text: 비상 사태</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #d4d4d4;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px 10px 50px 10px;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        h1 {
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #008000;
            margin: 0 0 5px 0;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            word-break: keep-all;
        }
        
        .subtitle {
            color: #ffd700;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .status-board {
            background: #1a1a1a;
            border: 1px solid #39ff14;
            padding: 6px 15px;
            color: #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 5px;
        }

        .timer-board {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            padding: 6px 15px;
            color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 5px;
            transition: all 0.1s;
        }

        @keyframes timePenaltyFlash {
            0% { background-color: #ff0000; color: #ffffff; transform: scale(1.2) rotate(-3deg); box-shadow: 0 0 30px #ff0000; }
            25% { transform: scale(1.1) rotate(3deg); }
            50% { transform: scale(1.15) rotate(-2deg); }
            100% { background-color: #1a1a1a; color: #ff3333; transform: scale(1) rotate(0deg); }
        }
        .flash { 
            animation: timePenaltyFlash 0.5s ease-out; 
            border-color: #ff0000 !important;
        }

        .ufo-track-container {
            max-width: 650px;
            margin: 0 auto 12px auto;
            background: #1a1a1a;
            border: 1px solid #39ff14;
            border-radius: 20px;
            height: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .ufo-progress {
            background: linear-gradient(90deg, #ff3333, #ff9933);
            height: 100%;
            width: 100%;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ufo-icon {
            position: absolute;
            top: -3px;
            left: 100%;
            font-size: 1.1rem;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(-100%);
            white-space: nowrap;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 220px));
            justify-content: center;
            gap: 12px 18px;
            max-width: 950px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            aspect-ratio: 2 / 3;
            perspective: 1000px;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .card-container { grid-template-columns: repeat(3, minmax(140px, 1fr)); }
        }
        @media (max-width: 600px) {
            .card-container { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s ease-out;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        .card-front {
            background: #0d1a0d;
            border: 2px solid #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4), inset 0 0 10px rgba(57, 255, 20, 0.2);
        }
        
        .card-front-inner {
            background-color: #111;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            border: 1px solid #222;
        }
        
        .card-front-inner p {
            background: rgba(0,0,0,0.85);
            color: #39ff14;
            padding: 6px 10px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid #39ff14;
            border-radius: 4px;
            line-height: 1.4;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .card-back {
            background-color: #0a0a0a;
            border: 2px solid #ff3333;
            box-shadow: inset 0 0 15px rgba(255, 51, 51, 0.2);
            transform: rotateY(180deg);
            color: #fff;
            padding: 10px;
        }
        
        .alien-icon { font-size: 1.8rem; text-shadow: 0 0 10px #39ff14; margin-bottom: 5px;}
        
        .btn-choice {
            background-color: #1a1a1a;
            color: #39ff14;
            border: 1px solid #39ff14;
            display: block;
            width: 100%;
            margin-bottom: 6px;
            padding: 10px 6px;
            font-family: inherit;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
            word-break: keep-all;
            line-height: 1.2;
        }
        .btn-choice:hover {
            background-color: #39ff14;
            color: #000;
        }

        .sentence-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed #ffd700;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-break: keep-all;
            color: #fff;
            text-align: left;
        }
        .highlight-blank {
            color: #ffd700;
            font-weight: 900;
            background: rgba(0,0,0,0.5);
            padding: 0 4px;
            border-radius: 3px;
        }

        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 13, 13, 0.95);
            padding: 6px 0;
            color: #39ff14;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 1000;
            text-shadow: 0 0 10px #39ff14, 0 0 20px rgba(57, 255
