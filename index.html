<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trick or Text: 비상 사태</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #d4d4d4;
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px 10px 50px 10px;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        h1 {
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #008000;
            margin: 0 0 5px 0;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            word-break: keep-all;
        }
        
        .subtitle {
            color: #ffd700;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .dashboard {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .status-board {
            background: #1a1a1a;
            border: 1px solid #39ff14;
            padding: 6px 15px;
            color: #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 5px;
        }

        .timer-board {
            background: #1a1a1a;
            border: 2px solid #ff3333;
            padding: 6px 15px;
            color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 5px;
            transition: all 0.1s;
        }

        @keyframes timePenaltyFlash {
            0% { background-color: #ff0000; color: #ffffff; transform: scale(1.2) rotate(-3deg); box-shadow: 0 0 30px #ff0000; }
            25% { transform: scale(1.1) rotate(3deg); }
            50% { transform: scale(1.15) rotate(-2deg); }
            100% { background-color: #1a1a1a; color: #ff3333; transform: scale(1) rotate(0deg); }
        }
        .flash { 
            animation: timePenaltyFlash 0.5s ease-out; 
            border-color: #ff0000 !important;
        }

        .ufo-track-container {
            max-width: 650px;
            margin: 0 auto 12px auto;
            background: #1a1a1a;
            border: 1px solid #39ff14;
            border-radius: 20px;
            height: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .ufo-progress {
            background: linear-gradient(90deg, #ff3333, #ff9933);
            height: 100%;
            width: 100%;
            transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .ufo-icon {
            position: absolute;
            top: -3px;
            left: 100%;
            font-size: 1.1rem;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(-100%);
            white-space: nowrap;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 210px));
            justify-content: center;
            gap: 12px 16px;
            max-width: 950px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            aspect-ratio: 2 / 3;
            perspective: 1000px;
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .card-container { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
        }
        @media (max-width: 600px) {
            .card-container { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s ease-out;
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        .card-front {
            background: #0d1a0d;
            border: 2px solid #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4), inset 0 0 10px rgba(57, 255, 20, 0.2);
        }
        
        .card-front-inner {
            background-color: #111;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            border: 1px solid #222;
        }
        
        .card-front-inner p {
            background: rgba(0,0,0,0.85);
            color: #39ff14;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #39ff14;
            border-radius: 4px;
            line-height: 1.3;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .card-back {
            background-color: #0a0a0a;
            border: 2px solid #ff3333;
            box-shadow: inset 0 0 15px rgba(255, 51, 51, 0.2);
            transform: rotateY(180deg);
            color: #fff;
            padding: 8px;
        }
        
        .alien-icon { font-size: 1.5rem; text-shadow: 0 0 10px #39ff14; margin-bottom: 2px;}
        
        .btn-choice {
            background-color: #1a1a1a;
            color: #39ff14;
            border: 1px solid #39ff14;
            display: block;
            width: 100%;
            margin-bottom: 5px;
            padding: 8px 4px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            word-break: keep-all;
            line-height: 1.2;
        }
        .btn-choice:hover {
            background-color: #39ff14;
            color: #000;
        }

        .sentence-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed #ffd700;
            padding: 6px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            line-height: 1.3;
            word-break: keep-all;
            color: #fff;
            text-align: left;
        }
        .highlight-blank {
            color: #ffd700;
            font-weight: 900;
            background: rgba(0,0,0,0.5);
            padding: 0 4px;
            border-radius: 3px;
        }

        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 13, 13, 0.95);
            padding: 6px 0;
            color: #39ff14;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 1000;
            text-shadow: 0 0 10px #39ff14, 0 0 20px rgba(57, 255, 20, 0.6);
            border-top: 1px solid rgba(57, 255, 20, 0.3);
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .error { animation: errorShake 0.3s ease-in-out; }
        
        .resolved {
            border-color: #39ff14 !important;
            box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.2) !important;
        }
        .resolved h3 { color: #39ff14; margin: 6px 0; font-size: 1.1rem; font-weight: 900; }

        .wrong-note-box {
            background: #1a0505;
            border: 1px solid #ff3333;
            padding: 15px;
            margin: 15px auto;
            max-width: 600px;
            border-radius: 8px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h1>👽 TRICK OR TEXT 📖</h1>
    <div class="subtitle">경고: 첫 카드 오픈 시 35초 카운트다운 시작! (오답 시 -5초 감점)<br><span style="color:#d4d4d4; font-size:0.8rem;">TIP: 카드의 빈 곳을 다시 클릭하면 표지로 뒤집어 볼 수 있습니다.</span></div>
    
    <div class="dashboard">
        <div class="status-board">
            [ 지켜낸 우리말 : <span id="score">0</span> / <span id="target-score">8</span> ]
        </div>
        <div class="timer-board" id="timer-display">
            ⏳ 35초
        </div>
    </div>

    <div class="ufo-track-container">
        <div class="ufo-progress" id="ufo-bar"></div>
        <div class="ufo-icon" id="ufo-ico">⏳🛸</div>
    </div>

    <div class="card-container" id="card-grid"></div>

    <div id="footer">
        &lt;매화뜨락_연결하는 도서관&gt;
    </div>
